<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Black Friday Toolkit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;600&display=swap">
<style>
  :root {
    --black: #000000;
    --white: #ffffff;
    --blush: #f9f1f2;
    --purple: #e579df;
    --purple-soft: #d5b9db;
    --ink: #000000;
    --ink-muted: #6b5f66;
    --line: #e9dde2;
    --surface: #ffffff;
    --ground: #f9f1f2;
    --field: #fbf7f8;
    --chip-hover: #f3e6ea;
    --focus: #e579df;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f6f0f2;
      --ink-muted: #b9aab1;
      --line: #3a3036;
      --surface: #1d181b;
      --ground: #141114;
      --field: #241e21;
      --chip-hover: #2c2429;
      --black: #f6f0f2;
      --white: #141114;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f6f0f2;
    --ink-muted: #b9aab1;
    --line: #3a3036;
    --surface: #1d181b;
    --ground: #141114;
    --field: #241e21;
    --chip-hover: #2c2429;
    --black: #f6f0f2;
    --white: #141114;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Work Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding-block: 0 96px;
    padding-inline: 20px;
  }

  .brandbar { padding-block: 28px 0; }
  .brandbar a { display: inline-block; line-height: 0; }
  .brandbar img { height: 26px; width: auto; display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brandbar img { filter: invert(1); }
  }
  :root[data-theme="dark"] .brandbar img { filter: invert(1); }

  .masthead { padding-block: 44px 32px; display: grid; gap: 14px; }
  .eyebrow { font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; font-size: 12px; color: var(--purple); }
  h1 {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: clamp(38px, 6vw, 60px);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  h1 em { font-style: italic; }
  .lede { max-width: none; margin: 0; color: var(--ink-muted); font-size: 16px; }

  .view-toggle { display: flex; gap: 8px; padding-block: 4px 18px; }
  .view-btn {
    font: inherit; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px;
    padding: 10px 16px; cursor: pointer;
  }
  .view-btn[aria-pressed="true"] { background: var(--black); color: var(--white); border-color: var(--black); }

  .toolbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--ground);
    padding-block: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .search {
    flex: 1 1 240px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .search svg { width: 16px; height: 16px; flex: none; color: var(--ink-muted); }
  .search input { all: unset; flex: 1; min-width: 0; font: inherit; color: var(--ink); }
  .search input::placeholder { color: var(--ink-muted); }
  .search:focus-within { border-color: var(--focus); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px;
    padding: 9px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .chip:hover { background: var(--chip-hover); }
  .chip[aria-pressed="true"] { background: var(--black); color: var(--white); border-color: var(--black); }
  .chip .count { font-weight: 400; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip[aria-pressed="true"] .dot { outline: 2px solid var(--white); outline-offset: -1px; }
  .chip:focus-visible, .search input:focus-visible, .copy-btn:focus-visible,
  .view-btn:focus-visible, .expand-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .section { padding-block: 40px 8px; }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 8px; }
  .section-head h2 {
    font-family: 'Playfair Display', Georgia, serif; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; font-size: 28px; line-height: 1.1; margin: 0;
    display: flex; align-items: center; gap: 12px;
  }
  .section-head h2 .dot { width: 12px; height: 12px; border-radius: 50%; }
  .section-head .meta { color: var(--ink-muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .section-blurb { margin: 0 0 20px; color: var(--ink-muted); max-width: none; }

  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .card {
    padding: 18px 20px;
    border-top: 1px solid var(--line);
  }
  .card:first-child { border-top: 0; }
  .card[hidden] { display: none !important; }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; cursor: pointer; }
  .card-titles { min-width: 0; }
  .card-code { font-weight: 600; color: var(--purple); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 19px; margin: 2px 0 0; }
  .card-subject { color: var(--ink-muted); font-size: 14px; margin-top: 4px; }
  .card-vault { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .vault-tag {
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--field); border: 1px solid var(--line); color: var(--ink-muted);
    border-radius: 6px; padding: 3px 8px;
  }
  .card-actions { display: flex; align-items: flex-start; gap: 8px; flex: none; }
  .icon-btn {
    font: inherit; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    background: transparent; color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; white-space: nowrap;
  }
  .icon-btn:hover { background: var(--chip-hover); }
  .icon-btn.copied { background: var(--purple); border-color: var(--purple); color: #fff; }
  .card-body {
    margin-top: 14px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.6;
    display: none;
  }
  .card.is-open .card-body { display: block; }
  .card.is-copied { background: var(--blush); }
  :root[data-theme="dark"] .card.is-copied { background: #2a1f27; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .card.is-copied { background: #2a1f27; }
  }

  .empty { padding: 28px 20px; color: var(--ink-muted); text-align: center; font-style: italic; font-family: 'Playfair Display', Georgia, serif; font-size: 18px; }

  .tally {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--black); color: var(--white);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 10px 20px; font-size: 14px; z-index: 6;
  }
  .tally strong { font-weight: 600; font-variant-numeric: tabular-nums; }
  .toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 16px; font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 7;
  }

  .site-footer {
    margin-top: 64px; padding-block: 28px 8px; border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px 24px; font-size: 13px; color: var(--ink-muted);
  }
  .site-footer nav { display: flex; flex-wrap: wrap; gap: 6px 22px; }
  .site-footer a {
    color: var(--ink); text-decoration: none; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; font-size: 12px; border-bottom: 1.5px solid transparent; padding-bottom: 2px;
  }
  .site-footer a:hover, .site-footer a:focus-visible { border-bottom-color: var(--purple); outline: none; }

  @media (max-width: 680px) {
    .lede br { display: none; }
    .masthead { padding-block: 32px 24px; }
    .brandbar img { height: 22px; }
    .section-head h2 { font-size: 26px; }
    .card-head { flex-direction: column; align-items: stretch; }
    .card-actions { justify-content: flex-end; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print {
    .toolbar, .tally, .toast, .view-toggle { display: none !important; }
    .wrap { padding-block: 0; }
    .list { border: 0; }
    .card-body { display: block !important; border: 0; background: transparent; padding: 0; }
  }
</style>

</head>

  var GROUPS = {
    grow: { name: 'Grow', color: '#e579df' },
    nurture: { name: 'Nurture', color: '#d5b9db' },
    sell: { name: 'Sell', color: 'ink' }
  };

  var KEY = 'bfms-toolkit-v1';
  var state = { copied: {} };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object') state.copied = saved.copied || {};
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var sectionsEl = document.getElementById('sections');
  var currentView = 'foundational';

  function renderView(view) {
    currentView = view;
    var items = TEMPLATES.filter(function (t) { return t.section === view; });
    var html = '';
    Object.keys(GROUPS).forEach(function (key) {
      var g = GROUPS[key];
      var dotColor = g.color === 'ink' ? 'var(--ink)' : g.color;
      var groupItems = items.filter(function (t) { return t.group === key; });
      if (!groupItems.length) return;
      var blurb = view === 'foundational'
        ? 'The ' + g.name.toLowerCase() + ' sequence: four emails, sent in order, the spine of that intention.'
        : 'One template per ' + g.name.toLowerCase() + '-offer format. Matched to the ideas in the Offer Vault.';
      html += '<section class="section" data-group="' + key + '" id="section-' + key + '">' +
        '<div class="section-head"><h2><span class="dot" style="background:' + dotColor + '"></span>' + esc(g.name) + '</h2>' +
        '<span class="meta">' + groupItems.length + ' template' + (groupItems.length === 1 ? '' : 's') + '</span></div>' +
        '<p class="section-blurb">' + esc(blurb) + '</p>' +
        '<div class="list">';
      groupItems.forEach(function (t) {
        var vaultTags = t.vaultIds.length
          ? '<div class="card-vault">' + t.vaultIds.map(function (v) { return '<span class="vault-tag">Vault ' + esc(v) + '</span>'; }).join('') + '</div>'
          : '';
        html += '<article class="card" data-id="' + t.code + '">' +
          '<div class="card-head">' +
            '<div class="card-titles">' +
              '<div class="card-code">' + esc(t.code) + '</div>' +
              '<h3 class="card-title">' + esc(t.title) + '</h3>' +
              '<div class="card-subject">Subject: ' + esc(t.subject) + '</div>' +
              vaultTags +
            '</div>' +
            '<div class="card-actions">' +
              '<button class="icon-btn expand-btn" type="button">View</button>' +
              '<button class="icon-btn copy-btn" type="button">Copy</button>' +
            '</div>' +
          '</div>' +
          '<div class="card-body">' + esc('Subject: ' + t.subject + '\n\n' + t.body) + '</div>' +
        '</article>';
      });
      html += '<div class="empty" hidden>No matches in this section.</div></div></section>';
    });
    sectionsEl.innerHTML = html;
    wireCards();
    applyFilters();
  }

  function wireCards() {
    var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
    cards.forEach(function (card) {
      var id = card.dataset.id;
      var expandBtn = card.querySelector('.expand-btn');
      var copyBtn = card.querySelector('.copy-btn');
      if (state.copied[id]) { card.classList.add('is-copied'); copyBtn.classList.add('copied'); copyBtn.textContent = 'Copied'; }
      expandBtn.addEventListener('click', function () {
        card.classList.toggle('is-open');
        expandBtn.textContent = card.classList.contains('is-open') ? 'Hide' : 'View';
      });
      copyBtn.addEventListener('click', function () {
        var t = TEMPLATES.filter(function (x) { return x.code === id; })[0];
        var text = 'Subject: ' + t.subject + '\n\n' + t.body;
        var done = function () {
          state.copied[id] = true; save();
          card.classList.add('is-copied');
          copyBtn.classList.add('copied');
          copyBtn.textContent = 'Copied';
          updateTally();
          toast(t.code + ' copied. Paste it into your email tool.');
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
        } else { fallbackCopy(text); done(); }
      });
    });
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  // View toggle
  var viewBtns = Array.prototype.slice.call(document.querySelectorAll('.view-btn'));
  viewBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      viewBtns.forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
      renderView(btn.dataset.view);
    });
  });

  // Filters
  var filter = 'all';
  var query = '';
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip[data-filter]'));
  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      filter = chip.dataset.filter;
      chips.forEach(function (c) { c.setAttribute('aria-pressed', c === chip ? 'true' : 'false'); });
      applyFilters();
    });
  });
  var searchEl = document.getElementById('search');
  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim().toLowerCase();
    applyFilters();
  });

  function applyFilters() {
    var visibleTotal = 0;
    Object.keys(GROUPS).forEach(function (key) {
      var section = document.getElementById('section-' + key);
      if (!section) return;
      var visible = 0;
      var cards = section.querySelectorAll('.card');
      Array.prototype.forEach.call(cards, function (card) {
        var id = card.dataset.id;
        var t = TEMPLATES.filter(function (x) { return x.code === id; })[0];
        var haystack = (t.title + ' ' + t.subject + ' ' + t.body + ' ' + t.vaultIds.join(' ')).toLowerCase();
        var show = (filter === 'all' || filter === key) && (!query || haystack.indexOf(query) !== -1);
        card.hidden = !show;
        if (show) visible++;
      });
      section.querySelector('.empty').hidden = visible > 0;
      section.hidden = (filter !== 'all' && filter !== key);
      visibleTotal += visible;
    });
    document.getElementById('tally-visible').textContent = visibleTotal;
    document.getElementById('tally-word').textContent = 'shown';
    Object.keys(GROUPS).forEach(function (key) {
      var el = document.querySelector('[data-count="' + key + '"]');
      if (el) el.textContent = TEMPLATES.filter(function (t) { return t.section === currentView && t.group === key; }).length;
    });
    var allEl = document.querySelector('[data-count="all"]');
    if (allEl) allEl.textContent = TEMPLATES.filter(function (t) { return t.section === currentView; }).length;
  }

  function updateTally() {
    document.getElementById('tally-copied').textContent = Object.keys(state.copied).length;
  }

  var toastEl = null, toastTimer = null;
  function toast(msg) {
    if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status'); document.body.appendChild(toastEl); }
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2600);
  }

  document.getElementById('year').textContent = new Date().getFullYear();
  renderView('foundational');
  updateTally();
})();
</script>
</body>
</html>
